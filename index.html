<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Técnico PWA</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--background);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--surface);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        #app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .image-viewer {
            height: 40vh;
            background: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-slider {
            display: flex;
            height: 100%;
            width: 100%;
            transition: transform 0.3s ease-out;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .no-image {
            color: #fff;
            font-size: 0.9rem;
            text-align: center;
        }

        .dots-container {
            position: absolute;
            bottom: 10px;
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
        }

        .dot.active {
            background: #fff;
        }

        .piece-info {
            background: var(--surface);
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .piece-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .piece-code {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .action-bar {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .action-bar .btn {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        .measurements-container {
            flex: 1;
            background: var(--surface);
            overflow-y: auto;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            position: sticky;
            top: 0;
            background: #f1f5f9;
            z-index: 2;
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .obs-section {
            padding: 1rem;
            background: #f8fafc;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s ease-in-out;
        }

        .modal.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: var(--surface);
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            border-radius: 12px;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        input, select, textarea {
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
        }

        .search-results {
            border: 1px solid var(--border);
            border-top: none;
            max-height: 150px;
            overflow-y: auto;
            border-radius: 0 0 6px 6px;
            background: white;
        }

        .search-item {
            padding: 0.6rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .search-item:hover {
            background: #f1f5f9;
        }

        .measurement-row-form {
            display: grid;
            grid-template-columns: 1fr 1fr 80px auto;
            gap: 0.5rem;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <button class="btn btn-secondary" onclick="openSearchModal()">🔍 Buscar</button>
        <h2>Catálogo</h2>
        <button class="btn" onclick="openCadastroModal()">＋ Novo</button>
    </header>

    <div id="app-container">
        <div class="image-viewer" id="imageViewer">
            <div class="image-slider" id="imageSlider"></div>
            <div class="dots-container" id="dotsContainer"></div>
        </div>

        <div class="piece-info">
            <div class="piece-title" id="viewNome">Nenhuma peça cadastrada</div>
            <div class="piece-code" id="viewCodigo">Código: --</div>
            <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px;" id="viewMeta"></div>
            
            <div class="action-bar" id="actionBar" style="display: none;">
                <button class="btn btn-warning" onclick="prepararEdicao()">✏️ Editar</button>
                <button class="btn btn-danger" onclick="deletarPecaAtual()">🗑️ Excluir</button>
            </div>
        </div>

        <div class="measurements-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome da Medida</th>
                        <th>Valor</th>
                        <th>Unidade</th>
                    </tr>
                </thead>
                <tbody id="measurementsTableBody"></tbody>
            </table>
        </div>

        <div class="obs-section">
            <strong>Observações:</strong>
            <p id="viewObservacao">--</p>
        </div>
    </div>

    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h3>Buscar Peça</h3>
            <div class="form-group">
                <label>Buscar por:</label>
                <select id="searchType">
                    <option value="nome">Nome do Produto</option>
                    <option value="codigo">Código do Produto</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="searchInput" placeholder="Comece a digitar..." oninput="handleSearchInput()">
                <div class="search-results" id="searchResults" style="display: none;"></div>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                <button class="btn btn-secondary" onclick="closeModal('searchModal')">Fechar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="cadastroModal">
        <div class="modal-content">
            <h3 id="modalTitle">Cadastrar Nova Peça</h3>
            <form id="cadastroForm" onsubmit="salvarPeca(event)">
                <input type="hidden" id="formId">

                <div class="form-group">
                    <label>Código da Empresa (Único) *</label>
                    <input type="text" id="formCodigo" required>
                </div>
                <div class="form-group">
                    <label>Nome do Produto *</label>
                    <input type="text" id="formNome" required>
                </div>
                <div class="form-group">
                    <label>Quem está alterando/cadastrando? *</label>
                    <input type="text" id="formResponsavel" required>
                </div>
                
                <div class="form-group">
                    <label id="labelFotos">Fotos (1 a 6 imagens) *</label>
                    <input type="file" id="formFotos" accept="image/*" multiple onchange="validarFotos(this)">
                    <small id="ajudaFotos" style="color: var(--text-secondary);">Selecione arquivos caso queira substituir as fotos atuais.</small>
                </div>

                <div class="form-group">
                    <label>Medidas do Produto</label>
                    <div id="formMedidasLista" style="display:flex; flex-direction:column; gap:0.5rem;"></div>
                    <button type="button" class="btn btn-secondary" style="margin-top: 0.5rem;" onclick="adicionarLinhaMedida()">＋ Adicionar Medida</button>
                </div>

                <div class="form-group">
                    <label>Observações (Máx 200 caracteres)</label>
                    <textarea id="formObservacao" maxlength="200" rows="3"></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('cadastroModal')">Cancelar</button>
                    <button type="submit" class="btn" id="btnSalvar">Salvar Peça</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker registrado!'))
                    .catch(err => console.error(err));
            });
        }

        let db;
        const dbName = "CatalogoTecnicoDB";
        
        function initDB() {
            const request = indexedDB.open(dbName, 1);
            request.onerror = (e) => console.error("Erro no banco:", e);
            request.onsuccess = (e) => {
                db = e.target.result;
                carregarPecas();
            };
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                const store = db.createObjectStore("pecas", { keyPath: "id", autoIncrement: true });
                store.createIndex("codigo", "codigo", { unique: true });
                db.createObjectStore("nomesMedidas", { keyPath: "nome" });
            };
        }

        let pecas = [];
        let currentIndex = 0;
        let currentPhotoIndex = 0;
        let nomesMedidasExistentes = [];

        let touchStartX = 0;
        let touchStartY = 0;
        const container = document.getElementById('app-container');

        container.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        container.addEventListener('touchend', e => {
            const diffX = e.changedTouches[0].screenX - touchStartX;
            const diffY = e.changedTouches[0].screenY - touchStartY;
            
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 50) {
                    if (diffX > 0) mudarFoto(-1);
                    else mudarFoto(1);
                }
            } else {
                if (Math.abs(diffY) > 50) {
                    if (diffY > 0) mudarPeca(-1);
                    else mudarPeca(1);
                }
            }
        }, {passive: true});

        function resetarVisualizacaoVazia() {
            document.getElementById('viewNome').innerText = "Nenhuma peça cadastrada";
            document.getElementById('viewCodigo').innerText = "Código: --";
            document.getElementById('viewObservacao').innerText = "--";
            document.getElementById('viewMeta').innerText = "";
            document.getElementById('actionBar').style.display = "none";
            document.getElementById('imageSlider').innerHTML = '';
            document.getElementById('dotsContainer').innerHTML = '';
            document.getElementById('measurementsTableBody').innerHTML = '';
        }

        function exibirPecaAtual() {
            if (pecas.length === 0) {
                resetarVisualizacaoVazia();
                return;
            }
            
            const peca = pecas[currentIndex];
            currentPhotoIndex = 0;

            document.getElementById('viewNome').innerText = peca.nome;
            document.getElementById('viewCodigo').innerText = `Código: ${peca.codigo}`;
            document.getElementById('viewObservacao').innerText = peca.observacao || "Sem observações.";
            document.getElementById('viewMeta').innerText = `Modificado por: ${peca.responsavel} em ${peca.dataHora}`;
            document.getElementById('actionBar').style.display = "flex";

            atualizarSliderFotos(peca.fotos);

            const tbody = document.getElementById('measurementsTableBody');
            tbody.innerHTML = '';
            peca.medidas.forEach(m => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${m.nome}</td><td>${m.valor}</td><td>${m.unidade}</td>`;
                tbody.appendChild(tr);
            });
        }

        function atualizarSliderFotos(fotos) {
            const slider = document.getElementById('imageSlider');
            const dotsContainer = document.getElementById('dotsContainer');
            slider.innerHTML = '';
            dotsContainer.innerHTML = '';
            slider.style.transform = `translateX(0%)`;

            if(!fotos || fotos.length === 0) {
                slider.innerHTML = `<div class="slide"><div class="no-image">Nenhuma imagem disponível</div></div>`;
                return;
            }

            fotos.forEach((fotoBase64, idx) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.innerHTML = `<img src="${fotoBase64}" alt="Foto ${idx+1}">`;
                slider.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = `dot ${idx === 0 ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
            });
        }

        function mudarFoto(direcao) {
            if (pecas.length === 0) return;
            const fotos = pecas[currentIndex].fotos;
            if (!fotos || fotos.length <= 1) return;

            currentPhotoIndex += direcao;
            if (currentPhotoIndex < 0) currentPhotoIndex = 0;
            if (currentPhotoIndex >= fotos.length) currentPhotoIndex = fotos.length - 1;

            document.getElementById('imageSlider').style.transform = `translateX(-${currentPhotoIndex * 100}%)`;
            
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentPhotoIndex);
            });
        }

        function mudarPeca(direcao) {
            if (pecas.length <= 1) return;
            currentIndex += direcao;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= pecas.length) currentIndex = pecas.length - 1;
            exibirPecaAtual();
        }

        function carregarPecas(focarId = null) {
            const transaction = db.transaction(["pecas", "nomesMedidas"], "readonly");
            
            transaction.objectStore("pecas").getAll().onsuccess = (e) => {
                pecas = e.target.result;
                if (pecas.length > 0) {
                    if (focarId) {
                        const indexEncontrado = pecas.findIndex(p => p.id === focarId);
                        currentIndex = indexEncontrado !== -1 ? indexEncontrado : 0;
                    } else if (currentIndex >= pecas.length) {
                        currentIndex = pecas.length - 1;
                    }
                    exibirPecaAtual();
                } else {
                    resetarVisualizacaoVazia();
                }
            };

            transaction.objectStore("nomesMedidas").getAll().onsuccess = (e) => {
                nomesMedidasExistentes = e.target.result.map(item => item.nome);
            };
        }

        function validarFotos(input) {
            if (input.files.length > 6) {
                alert("Você só pode selecionar no máximo 6 fotos.");
                input.value = "";
            }
        }

        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // SALVAR (INSERIR OU ALTERAR) PEÇA
        async function salvarPeca(e) {
            e.preventDefault();
            
            const id = document.getElementById('formId').value;
            const codigo = document.getElementById('formCodigo').value.trim();
            const nome = document.getElementById('formNome').value.trim();
            const responsavel = document.getElementById('formResponsavel').value.trim();
            const observacao = document.getElementById('formObservacao').value.substring(0, 200);
            const inputFotos = document.getElementById('formFotos').files;

            let fotos = [];
            
            // Modo Criação exige fotos. Modo Edição mantém as antigas se não enviar novas.
            if (!id && inputFotos.length === 0) {
                alert("Por favor, selecione pelo menos 1 foto para o cadastro.");
                return;
            }

            if (inputFotos.length > 0) {
                const fotosPromessas = Array.from(inputFotos).map(file => fileToBase64(file));
                fotos = await Promise.all(fotosPromessas);
            } else if (id) {
                // Mantém as fotos atuais da peça que está sendo editada
                const pecaAntiga = pecas.find(p => p.id === parseInt(id));
                if (pecaAntiga) fotos = pecaAntiga.fotos;
            }

            const medidas = [];
            const rows = document.querySelectorAll('.measurement-row-form');
            const txNomes = db.transaction("nomesMedidas", "readwrite");
            const storeNomes = txNomes.objectStore("nomesMedidas");

            rows.forEach(row => {
                const selectNome = row.querySelector('.medida-nome-select').value;
                const inputNovoNome = row.querySelector('.medida-nome-novo').value.trim();
                const valor = row.querySelector('.medida-valor').value;
                const unidade = row.querySelector('.medida-unidade').value;

                let nomeFinal = selectNome === "NOVA" ? inputNovoNome : selectNome;
                
                if (nomeFinal && valor) {
                    medidas.push({ nome: nomeFinal, valor, unidade });
                    if (selectNome === "NOVA") {
                        storeNomes.put({ nome: nomeFinal });
                    }
                }
            });

            const dadosPeca = {
                codigo,
                nome,
                responsavel,
                observacao,
                fotos,
                medidas,
                dataHora: new Date().toLocaleString('pt-BR')
            };

            const txPeca = db.transaction("pecas", "readwrite");
            const storePeca = txPeca.objectStore("pecas");
            let request;

            if (id) {
                dadosPeca.id = parseInt(id);
                request = storePeca.put(dadosPeca); // Atualiza
            } else {
                request = storePeca.add(dadosPeca); // Insere novo
            }

            request.onsuccess = (evt) => {
                alert(id ? "Peça atualizada com sucesso!" : "Peça cadastrada com sucesso!");
                closeModal('cadastroModal');
                document.getElementById('cadastroForm').reset();
                
                // Recarrega focando na peça modificada/criada
                const idFoco = id ? parseInt(id) : evt.target.result;
                carregarPecas(idFoco);
            };

            request.onerror = () => {
                alert("Erro ao salvar! Verifique se o Código do Produto já está em uso por outra peça.");
            };
        }

        // EXCLUIR PEÇA DEFINITIVAMENTE
        function deletarPecaAtual() {
            if (pecas.length === 0) return;
            const peca = pecas[currentIndex];
            
            const confirmar = confirm(`ATENÇÃO:\nTem certeza que deseja apagar permanentemente o produto "${peca.nome}" (Código: ${peca.codigo}) e todas as suas imagens?`);
            
            if (confirmar) {
                const tx = db.transaction("pecas", "readwrite");
                const request = tx.objectStore("pecas").delete(peca.id);

                request.onsuccess = () => {
                    alert("Peça e imagens excluídas com sucesso!");
                    // Ajusta o ponteiro para não quebrar a navegação
                    if (currentIndex > 0) currentIndex--;
                    carregarPecas();
                };

                request.onerror = () => {
                    alert("Ocorreu um erro ao tentar excluir a peça.");
                };
            }
        }

        // PREPARAR FORMULÁRIO PARA EDIÇÃO (CARREGAR DADOS)
        function prepararEdicao() {
            if (pecas.length === 0) return;
            const peca = pecas[currentIndex];

            // Configura títulos e campos fixos
            document.getElementById('modalTitle').innerText = "Editar Dados da Peça";
            document.getElementById('btnSalvar').innerText = "Atualizar Peça";
            document.getElementById('formId').value = peca.id;
            document.getElementById('formCodigo').value = peca.codigo;
            document.getElementById('formNome').value = peca.nome;
            document.getElementById('formResponsavel').value = peca.responsavel || "";
            document.getElementById('formObservacao').value = peca.observacao || "";
            
            // Torna o input de fotos opcional ao editar
            document.getElementById('formFotos').required = false;
            document.getElementById('labelFotos').innerText = "Substituir Fotos (Opcional)";

            // Limpa e reinsere as linhas de medidas da peça
            const containerMedidas = document.getElementById('formMedidasLista');
            containerMedidas.innerHTML = '';

            if (peca.medidas && peca.medidas.length > 0) {
                peca.medidas.forEach(m => {
                    adicionarLinhaMedidaComValores(m.nome, m.valor, m.unidade);
                });
            } else {
                adicionarLinhaMedida();
            }

            document.getElementById('cadastroModal').classList.add('active');
        }

        function adicionarLinhaMedida() {
            adicionarLinhaMedidaComValores("", "", "mm");
        }

        // Auxiliar que constrói a linha de medida (vazia ou pré-preenchida)
        function adicionarLinhaMedidaComValores(nome, valor, unidade) {
            const container = document.getElementById('formMedidasLista');
            const row = document.createElement('div');
            row.className = 'measurement-row-form';

            let opcoes = `<option value="">Escolha...</option>`;
            let nomeExisteNoHistorico = false;

            nomesMedidasExistentes.forEach(n => {
                const selecionado = (n === nome) ? "selected" : "";
                if (n === nome) nomeExisteNoHistorico = true;
                opcoes += `<option value="${n}" ${selecionado}>${n}</option>`;
            });
            opcoes += `<option value="NOVA" style="color: blue; font-weight: bold;">[+ Nova Opção]</option>`;

            // Se o nome existe mas não estava no histórico padrão (caso raro), força exibição
            let styleInputNovo = "display:none;";
            let inputNovoValor = "";
            if (nome && !nomeExisteNoHistorico) {
                opcoes = opcoes.replace('value="NOVA"', 'value="NOVA" selected');
                styleInputNovo = "display:block;";
                inputNovoValor = nome;
            }

            row.innerHTML = `
                <select class="medida-nome-select" onchange="toggleNovoCampoMedida(this)">
                    ${opcoes}
                </select>
                <input type="text" class="medida-nome-novo" placeholder="Qual o Nome?" value="${inputNovoValor}" style="${styleInputNovo}">
                <input type="text" class="medida-valor" placeholder="Valor" value="${valor}" required>
                <select class="medida-unidade">
                    <option value="mm" ${unidade === 'mm' ? 'selected' : ''}>mm</option>
                    <option value="cm" ${unidade === 'cm' ? 'selected' : ''}>cm</option>
                    <option value="pol" ${unidade === 'pol' ? 'selected' : ''}>pol</option>
                </select>
                <button type="button" class="btn btn-secondary" onclick="this.parentElement.remove()" style="padding: 0.4rem 0.6rem; background:#fee2e2; color:#ef4444;">✕</button>
            `;
            container.appendChild(row);
        }

        function toggleNovoCampoMedida(select) {
            const inputNovo = select.nextElementSibling;
            if (select.value === "NOVA") {
                inputNovo.style.display = "block";
                inputNovo.required = true;
            } else {
                inputNovo.style.display = "none";
                inputNovo.required = false;
                inputNovo.value = "";
            }
        }

        function openCadastroModal() {
            // Reseta as configurações para o modo "Novo Cadastro" nativo
            document.getElementById('modalTitle').innerText = "Cadastrar Nova Peça";
            document.getElementById('btnSalvar').innerText = "Salvar Peça";
            document.getElementById('formId').value = "";
            document.getElementById('cadastroForm').reset();
            document.getElementById('formFotos').required = true;
            document.getElementById('labelFotos').innerText = "Fotos (1 a 6 imagens) *";
            
            document.getElementById('formMedidasLista').innerHTML = '';
            adicionarLinhaMedida();
            document.getElementById('cadastroModal').classList.add('active');
        }

        function openSearchModal() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('searchModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function handleSearchInput() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const type = document.getElementById('searchType').value;
            const resultsContainer = document.getElementById('searchResults');
            
            resultsContainer.innerHTML = '';
            if (!query) {
                resultsContainer.style.display = 'none';
                return;
            }

            const filtrados = pecas.filter(p => p[type].toLowerCase().includes(query));

            if (filtrados.length === 0) {
                resultsContainer.innerHTML = `<div class="search-item" style="color: var(--text-secondary)">Nenhuma peça encontrada</div>`;
            } else {
                filtrados.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'search-item';
                    item.innerHTML = `<strong>${p.codigo}</strong> - ${p.nome}`;
                    item.onclick = () => {
                        currentIndex = pecas.findIndex(item => item.id === p.id);
                        exibirPecaAtual();
                        closeModal('searchModal');
                    };
                    resultsContainer.appendChild(item);
                });
            }
            resultsContainer.style.display = 'block';
        }

        window.onload = initDB;
    </script>
</body>
</html>
