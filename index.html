<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Técnico PWA</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--background);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--surface);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text);
        }

        /* Container Principal de Navegação por Gestos */
        #app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Área do Viewer de Imagens */
        .image-viewer {
            height: 40vh;
            background: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-slider {
            display: flex;
            height: 100%;
            width: 100%;
            transition: transform 0.3s ease-out;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .no-image {
            color: #fff;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Indicador de bolinhas das fotos */
        .dots-container {
            position: absolute;
            bottom: 10px;
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
        }

        .dot.active {
            background: #fff;
        }

        /* Detalhes da Peça (Informações básicas flutuando ou fixas) */
        .piece-info {
            background: var(--surface);
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .piece-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .piece-code {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* Área da Tabela de Medidas com Rolagem Interna */
        .measurements-container {
            flex: 1;
            background: var(--surface);
            overflow-y: auto;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            position: sticky;
            top: 0;
            background: #f1f5f9;
            z-index: 2;
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .obs-section {
            padding: 1rem;
            background: #f8fafc;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
        }

        /* Modais / Popups */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s ease-in-out;
        }

        .modal.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: var(--surface);
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            border-radius: 12px;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        input, select, textarea {
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
        }

        /* Busca suspensa dinâmica */
        .search-results {
            border: 1px solid var(--border);
            border-top: none;
            max-height: 150px;
            overflow-y: auto;
            border-radius: 0 0 6px 6px;
            background: white;
        }

        .search-item {
            padding: 0.6rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .search-item:hover {
            background: #f1f5f9;
        }

        .measurement-row-form {
            display: grid;
            grid-template-columns: 1fr 1fr 80px auto;
            gap: 0.5rem;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <button class="btn btn-secondary" onclick="openSearchModal()">🔍 Buscar</button>
        <h2>Catálogo</h2>
        <button class="btn" onclick="openCadastroModal()">＋ Novo</button>
    </header>

    <div id="app-container">
        <div class="image-viewer" id="imageViewer">
            <div class="image-slider" id="imageSlider">
                </div>
            <div class="dots-container" id="dotsContainer"></div>
        </div>

        <div class="piece-info">
            <div class="piece-title" id="viewNome">Nenhuma peça cadastrada</div>
            <div class="piece-code" id="viewCodigo">Código: --</div>
            <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px;" id="viewMeta"></div>
        </div>

        <div class="measurements-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome da Medida</th>
                        <th>Valor</th>
                        <th>Unidade</th>
                    </tr>
                </thead>
                <tbody id="measurementsTableBody">
                    </tbody>
            </table>
        </div>

        <div class="obs-section">
            <strong>Observações:</strong>
            <p id="viewObservacao">--</p>
        </div>
    </div>

    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h3>Buscar Peça</h3>
            <div class="form-group">
                <label>Buscar por:</label>
                <select id="searchType">
                    <option value="nome">Nome do Produto</option>
                    <option value="codigo">Código do Produto</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="searchInput" placeholder="Comece a digitar..." oninput="handleSearchInput()">
                <div class="search-results" id="searchResults" style="display: none;"></div>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                <button class="btn btn-secondary" onclick="closeModal('searchModal')">Fechar</button>
            </div>
        </div>
    </div>
